name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run physics, scoring and AI tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/sim_test.cpp src/sim/Sim.cpp -o sim_test
          ./sim_test
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/score_test.cpp src/sim/Score.cpp -o score_test
          ./score_test
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/ai_test.cpp src/sim/Ai.cpp src/sim/Sim.cpp -o ai_test
          ./ai_test

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua', 'lib/commonlibf4/xmake.lua', 'lib/commonlibf4/lib/commonlib-shared/xmake.lua') }}
          restore-keys: xmake-pkgs-${{ runner.os }}-

      - name: Configure
        run: xmake f -m releasedbg -y

      - name: Build
        run: xmake build -y fo4bowling

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force "$stage" | Out-Null
          Copy-Item -Recurse dist/Data "$stage/Data"
          Copy-Item build/out/F4SE/Plugins/fo4bowling.dll "$stage/Data/F4SE/Plugins/"
          Copy-Item build/out/F4SE/Plugins/fo4bowling.pdb "$stage/Data/F4SE/Plugins/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/Data/F4SE/Plugins/fo4bowling-LICENSE.txt" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse $stage | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: fo4bowling
          path: stage/

      # The latest main build, also as plain files on the 'builds' branch (one commit, replaced each time), so it
      # can be fetched with git as well as downloaded from the run page.
      - name: Publish to the builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Set-Location stage
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path stage/Data -DestinationPath "fo4bowling-${{ github.ref_name }}.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fo4bowling-${{ github.ref_name }}.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
