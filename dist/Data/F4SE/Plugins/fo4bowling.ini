; fo4bowling settings. Re-read every time a game starts, so you can edit this with the game running.
;
; Bowl at Back Alley Bowling (the General Atomics Galleria), lanes 3 and 6: look at the lane's ball return and press
; the activate key (F). Left/right there picks 1 to 4 players (taking turns at one keyboard).

[Keys]
; Windows virtual-key codes. 0 = off.
iLeft=0x41         ; A: move along the foul line to your left (held)
iRight=0x44        ; D: to your right
iHookLeft=0x57     ; W: more spin hooking left (a right-hander's hook)
iHookRight=0x53    ; S: more spin hooking right (a left-hander's)
iFewerPlayers=0x25 ; Left arrow, at a ball return: the previous choice of who plays (solo, you vs a companion, 2-4 players)
iMorePlayers=0x27  ; Right arrow: the next one
iQuit=0x58         ; X, twice: stop the game
fActivateDistance=240 ; how close to the ball return F works

[Throw]
; The camera stays put while you aim: move the mouse sideways to aim (the green line). Then hold the left mouse
; button: pull the mouse back for power and move it sideways for spin (left hooks left), and let go to throw.
; Letting go at 0% cancels.
fMinSpeed=300      ; the ball's speed at the least power, units per second
fMaxSpeed=820      ; ...and at full power
fPullPerCount=0.002 ; power per count of mouse pull: 0.002 = full power after 500 counts
bInvertPull=0      ; 1 = push the mouse forward for power
fAimPerCount=0.012 ; degrees of aim per count of sideways mouse movement
fMaxAim=6          ; the most you can angle the throw, degrees either side of straight
fRevs=65           ; how much the ball spins, radians per second. More spin, more hook
fMaxHook=50        ; how far full hook (100%) turns the spin axis sideways, degrees
fHookStep=10       ; percent of full hook per press of W/S
fSpinPerCount=0.25 ; percent of full hook per count of sideways mouse movement during the swing (0 = off)
fMoveSpeed=60      ; how fast you move along the foul line, units per second
fInaccuracy=1.0    ; how much each throw strays from what you set up: line, pace, spin (0 = never). More when thrown harder
fLaneDrift=1.0     ; how much the lane drifts the ball left or right, a little differently every ball (0 = never)

[Guide]
bEnabled=1         ; the green aim line from the ball
fLength=420        ; how far down the lane it goes
bFlipY=1           ; if the line shows up mirrored top to bottom, set 0

[Camera]
fDistance=95       ; behind the ball while you aim
fHeight=30         ; above it
fPitch=10          ; degrees down
bFollowBall=1      ; the camera rolls down the lane behind the ball
fFollowStop=760    ; ...and stops this far down the lane (from the foul line) to watch the pins

[Lane]
; nudges for where the lanes are, if the pins or ball look off (both lanes)
fOffsetX=0         ; + towards the pins
fOffsetY=0         ; + to the bowler's left
fOffsetZ=0         ; + up

[Return]
; where the two balls sit on the ball return, along its length (towards the hood) and their height
fSpot1=37.5
fSpot2=57.5
fZ=53.6
fHood=110          ; a ball comes back out of the hood here...
fSpeed=70          ; ...and rolls down at this speed

[Sound]
; real bowling alley recordings (Data\Sound\fo4bowling), heard from where they happen
bEnabled=1
fVolume=0.8
fFullDistance=300  ; full volume within this far of the camera...
fMaxDistance=3500  ; ...fading to nothing here

[HUD]
fScale=1.0
bNotifications=0   ; 1: calls (Strike!) also as the game's own notifications. Without F4SE Menu Framework they always are

[Physics]
; the lane, ball and pins, in game units. The defaults are measured off lanes 3 and 6 and the vanilla meshes.
; The pins are real rigid bodies (a regulation pin's mass and inertia, its shape, friction and bounce).
fHeadPin=1064      ; foul line to the head pin
fLaneHalfWidth=64  ; the playing surface either side of the middle; past it the ball drops into the gutter
fGutterWidth=24
fGutterDepth=8
fKickback=112      ; the side walls round the pin deck
fKickbackStart=1024
fDeckEnd=1280      ; the pit
fOilLength=700     ; the oiled front of the lane: the ball skids there and hooks once it reaches the dry part
fOilFriction=0.04
fDryFriction=0.20
fRollResistance=0.010
fBallRadius=9.25
fPinSpacing=28     ; pin spot to pin spot
fPinRestitution=0.70    ; how lively the pins are off the ball
fPinPinRestitution=0.55 ; ...and off each other
fPinDeckFriction=0.35   ; pins sliding on the deck
fPinFriction=0.30       ; pins rubbing on each other and the ball
fPinJitter=0.3     ; how far off its spot the pinsetter may put a pin
